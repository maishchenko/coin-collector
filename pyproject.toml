[project]
name = "coin-collector"
version = "0.1.0"
description = "Учебная 2D-игра на PyGame с таблицей рекордов SQLite"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pygame>=2.6.1,<3.0.0"]

[tool.poetry]
packages = [{ include = "coin_collector", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
